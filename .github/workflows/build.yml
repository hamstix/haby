name: Build

on:
  workflow_call:
    inputs:
      candidate:
        description: Immutable tested commit supplied by installed trusted control
        required: true
        type: string
      postgresql-selection:
        description: Trusted installed merge-control selection JSON; absent means full
        required: false
        default: ''
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HABY_TEST_SOURCE_ROOT: ${{ github.workspace }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.routing.outputs.full }}
      # Legacy alias only: ordinary expensive routing is NOT activated here.
      runtime: ${{ steps.routing.outputs.full }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify fail-closed CI routing and documentation controls
        run: node --test ./scripts/test-ci-change-routing.mjs ./scripts/test-postgresql-relevance.mjs ./scripts/test-merge-qualification.mjs

      - name: Verify installed final control isolation and fail-closed reduction
        run: node --test ./scripts/test-final-qualification.mjs

      - name: Verify exact PostgreSQL union accounting without runtime
        shell: pwsh
        run: ./scripts/test-postgresql-union.ps1

      - name: Classify complete change and validate documentation
        id: routing
        env:
          QUALIFICATION_CANDIDATE: ${{ inputs.candidate }}
        run: |
          if [ -n "$QUALIFICATION_CANDIDATE" ]; then
            [[ "$QUALIFICATION_CANDIDATE" =~ ^[0-9a-f]{40}$ ]] || exit 1
            # Explicit final invocation always retains complete existing gates.
            echo 'full=true' >> "$GITHUB_OUTPUT"
          else
            node ./scripts/ci-change-routing.mjs
          fi

      - name: Set up .NET SDK
        if: steps.routing.outputs.full == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.routing.outputs.full == 'true'
        run: dotnet restore ./HamstixHaby.slnx --artifacts-path ./.artifacts

      - name: Build
        if: steps.routing.outputs.full == 'true'
        run: dotnet build ./HamstixHaby.slnx --no-restore --artifacts-path ./.artifacts

      - name: Test
        if: steps.routing.outputs.full == 'true'
        run: dotnet test ./HamstixHaby.slnx --no-build --artifacts-path ./.artifacts --logger trx --results-directory ./.artifacts/fast/private

      - name: Verify fast case and parameter gate inventory
        if: always() && steps.routing.outputs.full == 'true'
        shell: pwsh
        run: |
          $trx = @(Get-ChildItem ./.artifacts/fast/private -Filter *.trx -File).FullName
          ./scripts/export-test-gate.ps1 -TrxPath $trx -OutputDirectory ./.artifacts/fast/safe -Gate validate -Suite fast

      - name: Publish allowlisted fast inventory
        if: always() && steps.routing.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fast-inventory-${{ inputs.candidate || github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/fast/safe/gate.json
            .artifacts/fast/safe/cases.json
            .artifacts/fast/safe/counts.json
            .artifacts/fast/safe/failure-evidence.json
            .artifacts/fast/safe/results.trx
          if-no-files-found: error
          retention-days: 14

      - name: Verify PostgreSQL timing artifact safety and failure propagation
        if: steps.routing.outputs.full == 'true'
        shell: pwsh
        run: ./scripts/test-postgresql-timing-export.ps1

      - name: Verify bounded failure evidence and adversarial publication controls
        if: steps.routing.outputs.full == 'true'
        shell: pwsh
        run: ./scripts/test-postgresql-failure-evidence.ps1

      - name: Verify fixed consumer image identity and publication controls
        if: steps.routing.outputs.full == 'true'
        shell: pwsh
        run: |
          ./scripts/test-runtime-consumer-image.ps1
          node ./scripts/test-runtime-consumer-registry.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Registry adapter controls failed.' }

      - name: Verify hosted entrypoint ownership, coverage and failure propagation
        if: steps.routing.outputs.full == 'true'
        shell: pwsh
        run: ./scripts/test-postgresql-entrypoint.ps1

      - name: Verify explicit suite selection and aggregate accounting
        if: steps.routing.outputs.full == 'true'
        shell: pwsh
        run: ./scripts/test-postgresql-suites.ps1

      - name: Verify named reflection precheck stops full execution on failure
        if: steps.routing.outputs.full == 'true'
        shell: pwsh
        run: ./scripts/test-anonymous-reflection-precheck.ps1

      - name: Verify Native AOT prerequisite fallback and failure propagation
        if: steps.routing.outputs.full == 'true'
        run: bash ./scripts/test-native-aot-prerequisites.sh

      - name: Verify optional native composition control and fail-closed publication
        if: steps.routing.outputs.full == 'true'
        shell: pwsh
        run: ./scripts/test-native-composition-control.ps1

      - name: Audit vulnerable dependencies
        if: steps.routing.outputs.full == 'true'
        run: |
          dotnet package list --project ./HamstixHaby.slnx --vulnerable --include-transitive --format json > dependency-audit.json
          jq -e '[.. | objects | select(has("severity"))] | length == 0' dependency-audit.json

      - name: Verify formatting
        if: steps.routing.outputs.full == 'true'
        run: dotnet format ./HamstixHaby.slnx --verify-no-changes --severity warn

      - name: Verify generated diff
        if: steps.routing.outputs.full == 'true'
        run: git diff --check --exit-code

  # Fixed names exist even when job conditions skip before matrix expansion.
  native-aot-windows:
    needs: validate
    if: needs.validate.outputs.runtime == 'true'
    name: Native AOT (win-x64)
    runs-on: windows-latest
    env:
      HABY_NATIVE_RID: win-x64
      HABY_NATIVE_EXECUTABLE: habyctl.exe
    defaults: &native-defaults
      run:
        shell: pwsh
    steps: &native-steps
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/ensure-native-aot-prerequisites.sh
      - name: Publish Native AOT executable (warnings as errors)
        run: |
          $toolchain = @()
          if ($IsLinux) {
            if (-not $env:HABY_AOT_C_COMPILER) { throw 'Validated Native AOT compiler is missing.' }
            $toolchain = @("-p:CppCompilerAndLinker=$env:HABY_AOT_C_COMPILER", '-p:LinkerFlavor=bfd')
          }
          dotnet publish ./src/habyctl/habyctl.csproj -c Release -r ${{ env.HABY_NATIVE_RID }} --self-contained true -p:PublishAot=true -p:TreatWarningsAsErrors=true @toolchain -o ./.artifacts/aot/${{ env.HABY_NATIVE_RID }}
          if ($LASTEXITCODE -ne 0) { throw "Native AOT publish failed: $LASTEXITCODE" }
          dotnet publish ./examples/Haby.RuntimeStartup.Consumer/Haby.RuntimeStartup.Consumer.csproj -c Release -r ${{ env.HABY_NATIVE_RID }} --self-contained true -p:PublishAot=true -p:TreatWarningsAsErrors=true @toolchain -o ./.artifacts/runtime-consumer/${{ env.HABY_NATIVE_RID }}
          if ($LASTEXITCODE -ne 0) { throw "Runtime consumer Native AOT publish failed: $LASTEXITCODE" }
          if (Test-Path ./examples/Haby.Cli.Composition/Haby.Cli.Composition.csproj) {
            dotnet publish ./examples/Haby.Cli.Composition/Haby.Cli.Composition.csproj -c Release -r ${{ env.HABY_NATIVE_RID }} --self-contained true -p:PublishAot=true -p:TreatWarningsAsErrors=true @toolchain -o ./.artifacts/cli-composition/${{ env.HABY_NATIVE_RID }}
            if ($LASTEXITCODE -ne 0) { throw "CLI composition Native AOT publish failed: $LASTEXITCODE" }
          }
      - name: Record actual patched Native AOT compiler selection
        run: |
          $rid = '${{ env.HABY_NATIVE_RID }}'
          $projects = @('src/habyctl', 'examples/Haby.RuntimeStartup.Consumer')
          $packs = @(foreach ($project in $projects) {
            $assets = Get-Content "$project/obj/project.assets.json" -Raw | ConvertFrom-Json
            $compiler = @($assets.libraries.PSObject.Properties.Name | Where-Object { $_.StartsWith('Microsoft.DotNet.ILCompiler/', [StringComparison]::Ordinal) })
            if ($compiler.Count -ne 1) { throw 'Native compiler selection evidence missing.' }
            $version = [Version]$compiler[0].Split('/')[1]
            if ($version.Major -ne 10 -or $version -lt [Version]'10.0.14') { throw 'Native compiler does not meet the patched .NET 10 baseline.' }
            $runtimeCompiler = "runtime.$rid.Microsoft.DotNet.ILCompiler/$version"
            if ($runtimeCompiler -notin $assets.libraries.PSObject.Properties.Name) { throw 'Runtime compiler pack does not match selected compiler.' }
            [pscustomobject]@{ project = $project; compiler = $compiler[0]; runtimeCompiler = $runtimeCompiler }
          })
          $samplePack = $null
          if (Test-Path ./examples/Haby.Cli.Composition/Haby.Cli.Composition.csproj) {
            $sampleAssets = Get-Content 'examples/Haby.Cli.Composition/obj/project.assets.json' -Raw | ConvertFrom-Json
            $sampleCompiler = @($sampleAssets.libraries.PSObject.Properties.Name | Where-Object { $_.StartsWith('Microsoft.DotNet.ILCompiler/', [StringComparison]::Ordinal) })
            if ($sampleCompiler.Count -ne 1) { throw 'CLI composition compiler selection evidence missing.' }
            $sampleVersion = [Version]$sampleCompiler[0].Split('/')[1]
            $sampleRuntime = "runtime.$rid.Microsoft.DotNet.ILCompiler/$sampleVersion"
            if ($sampleVersion.Major -ne 10 -or $sampleVersion -lt [Version]'10.0.14' -or $sampleRuntime -notin $sampleAssets.libraries.PSObject.Properties.Name) { throw 'CLI composition compiler does not meet the patched baseline.' }
            $samplePack = [pscustomobject]@{ compiler = $sampleCompiler[0]; runtimeCompiler = $sampleRuntime }
          }
          $directory = ".artifacts/native-results/$rid"
          New-Item -ItemType Directory -Force $directory | Out-Null
          [pscustomobject]@{ source = (& git rev-parse HEAD); sdk = (& dotnet --version); rid = $rid; packs = $packs; cliCompositionCompiler = $samplePack } |
            ConvertTo-Json -Depth 5 | Set-Content "$directory/compiler.json" -Encoding utf8
      - name: Execute published help and version
        run: |
          $cli = (Resolve-Path ./.artifacts/aot/${{ env.HABY_NATIVE_RID }}/${{ env.HABY_NATIVE_EXECUTABLE }}).Path
          & $cli --help
          if ($LASTEXITCODE -ne 0) { throw "Native AOT help failed: $LASTEXITCODE" }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "Native AOT version failed: $LASTEXITCODE" }
      - name: Test published binary against disposable loopback hosts
        run: |
          $env:HABY_AOT_CLI_REQUIRED = '1'
          $env:HABY_AOT_CLI_PATH = (Resolve-Path ./.artifacts/aot/${{ env.HABY_NATIVE_RID }}/${{ env.HABY_NATIVE_EXECUTABLE }}).Path
          $consumer = if ($IsWindows) { 'Haby.RuntimeStartup.Consumer.exe' } else { 'Haby.RuntimeStartup.Consumer' }
          $env:HABY_AOT_RUNTIME_CONSUMER_PATH = (Resolve-Path ./.artifacts/runtime-consumer/${{ env.HABY_NATIVE_RID }}/$consumer).Path
          if (Test-Path ./examples/Haby.Cli.Composition/Haby.Cli.Composition.csproj) {
            $composition = if ($IsWindows) { 'Haby.Cli.Composition.exe' } else { 'Haby.Cli.Composition' }
            $env:HABY_AOT_COMPOSITION_PATH = (Resolve-Path ./.artifacts/cli-composition/${{ env.HABY_NATIVE_RID }}/$composition).Path
          }
          dotnet test ./tests/Haby.Cli.Tests/Haby.Cli.Tests.csproj -c Release --filter FullyQualifiedName~CliLoopbackTests -p:TreatWarningsAsErrors=true --logger trx --results-directory ./.artifacts/native-results/${{ env.HABY_NATIVE_RID }}/private
          if ($LASTEXITCODE -ne 0) { throw "Native AOT loopback tests failed: $LASTEXITCODE" }
      - name: Verify published-native case and parameter gate inventory
        if: always()
        run: |
          $env:HABY_AOT_CLI_REQUIRED = '1'
          $env:HABY_AOT_CLI_PATH = (Resolve-Path ./.artifacts/aot/${{ env.HABY_NATIVE_RID }}/${{ env.HABY_NATIVE_EXECUTABLE }}).Path
          $consumer = if ($IsWindows) { 'Haby.RuntimeStartup.Consumer.exe' } else { 'Haby.RuntimeStartup.Consumer' }
          $env:HABY_AOT_RUNTIME_CONSUMER_PATH = (Resolve-Path ./.artifacts/runtime-consumer/${{ env.HABY_NATIVE_RID }}/$consumer).Path
          if (Test-Path ./examples/Haby.Cli.Composition/Haby.Cli.Composition.csproj) {
            $composition = if ($IsWindows) { 'Haby.Cli.Composition.exe' } else { 'Haby.Cli.Composition' }
            $env:HABY_AOT_COMPOSITION_PATH = (Resolve-Path ./.artifacts/cli-composition/${{ env.HABY_NATIVE_RID }}/$composition).Path
          }
          $trx = @(Get-ChildItem ./.artifacts/native-results/${{ env.HABY_NATIVE_RID }}/private -Filter *.trx -File).FullName
          ./scripts/export-test-gate.ps1 -TrxPath $trx -OutputDirectory ./.artifacts/native-results/${{ env.HABY_NATIVE_RID }}/safe -Gate 'Native AOT (${{ env.HABY_NATIVE_RID }})' -Suite published-native
      - name: Publish allowlisted native inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-inventory-${{ env.HABY_NATIVE_RID }}-${{ inputs.candidate || github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/native-results/${{ env.HABY_NATIVE_RID }}/compiler.json
            .artifacts/native-results/${{ env.HABY_NATIVE_RID }}/safe/gate.json
            .artifacts/native-results/${{ env.HABY_NATIVE_RID }}/safe/cases.json
            .artifacts/native-results/${{ env.HABY_NATIVE_RID }}/safe/counts.json
            .artifacts/native-results/${{ env.HABY_NATIVE_RID }}/safe/failure-evidence.json
            .artifacts/native-results/${{ env.HABY_NATIVE_RID }}/safe/results.trx
          if-no-files-found: error
          retention-days: 14

  native-aot-linux:
    needs: validate
    if: needs.validate.outputs.runtime == 'true'
    name: Native AOT (linux-x64)
    runs-on: ubuntu-latest
    env:
      HABY_NATIVE_RID: linux-x64
      HABY_NATIVE_EXECUTABLE: habyctl
    defaults: *native-defaults
    steps: *native-steps

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
      - name: Review dependency licenses and vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  postgresql-integration:
    needs: validate
    if: needs.validate.outputs.runtime == 'true' && (github.event_name != 'push' || inputs.candidate != '')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Native AOT prerequisites
        run: bash ./scripts/ensure-native-aot-prerequisites.sh
      - name: Publish native CLI for persisted planning, commit, execution and recovery rehearsals
        run: |
          test -n "$HABY_AOT_C_COMPILER"
          dotnet publish ./src/habyctl/habyctl.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:TreatWarningsAsErrors=true "-p:CppCompilerAndLinker=$HABY_AOT_C_COMPILER" -p:LinkerFlavor=bfd -o ./.artifacts/aot/linux-x64
      - name: Run real PostgreSQL integration tests
        shell: pwsh
        env:
          HABY_AOT_CLI_REQUIRED: '1'
          HABY_IMPORT_REHEARSAL_ISOLATED_PROFILE: '1'
          HABY_AOT_CLI_PATH: ${{ github.workspace }}/.artifacts/aot/linux-x64/habyctl
          TRUSTED_SELECTION: ${{ inputs.postgresql-selection }}
          CANDIDATE: ${{ inputs.candidate }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          $selectionPath = Join-Path $PWD '.artifacts/postgresql-selection.json'
          if ($env:TRUSTED_SELECTION) {
            [IO.File]::WriteAllText($selectionPath, $env:TRUSTED_SELECTION)
          } elseif (-not $env:CANDIDATE -and $env:PR_BASE) {
            node ./scripts/postgresql-relevance.mjs $PWD $env:PR_BASE (git rev-parse HEAD) $selectionPath
            if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL selection unavailable.' }
          }
          if ((Test-Path $selectionPath) -and (Get-Content $selectionPath -Raw | ConvertFrom-Json).scope -ceq 'targeted') {
            ./scripts/test-postgresql-measured.ps1 -Docker -SelectionPath $selectionPath -ResultsDirectory ./.artifacts/postgresql-measurement
          } else {
            ./scripts/test-postgresql-measured.ps1 -Docker -Suite full -AnonymousReflectionPrecheck -ResultsDirectory ./.artifacts/postgresql-measurement
          }
      - name: Publish external composition executable bytes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: operator-composition-sample-${{ inputs.candidate || github.sha }}-${{ github.run_attempt }}
          path: .artifacts/postgresql-measurement/composition-sample/
          if-no-files-found: error
          retention-days: 14
      - name: Publish allowlisted PostgreSQL timing and case inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-timing-${{ inputs.candidate || github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/postgresql-measurement/safe/measurement.json
            .artifacts/postgresql-measurement/safe/preflight.json
            .artifacts/postgresql-measurement/safe/resources.json
            .artifacts/postgresql-measurement/safe/coverage.json
            .artifacts/postgresql-measurement/safe/cases.json
            .artifacts/postgresql-measurement/safe/counts.json
            .artifacts/postgresql-measurement/safe/failure-evidence.json
            .artifacts/postgresql-measurement/safe/top-duration.csv
            .artifacts/postgresql-measurement/safe/class-duration.csv
            .artifacts/postgresql-measurement/safe/setup.csv
            .artifacts/postgresql-measurement/safe/results.trx
            .artifacts/postgresql-measurement/safe/host-diagnostics.csv
            .artifacts/postgresql-measurement/safe/anonymous-reflection-precheck/precheck.json
            .artifacts/postgresql-measurement/safe/anonymous-reflection-precheck/cases.json
            .artifacts/postgresql-measurement/safe/anonymous-reflection-precheck/counts.json
            .artifacts/postgresql-measurement/safe/anonymous-reflection-precheck/failure-evidence.json
            .artifacts/postgresql-measurement/safe/anonymous-reflection-precheck/results.trx
            .artifacts/postgresql-measurement/safe/anonymous-reflection-precheck/host-diagnostics.csv
            .artifacts/postgresql-measurement/safe/functional/cases.json
            .artifacts/postgresql-measurement/safe/functional/counts.json
            .artifacts/postgresql-measurement/safe/functional/failure-evidence.json
            .artifacts/postgresql-measurement/safe/functional/resources.json
            .artifacts/postgresql-measurement/safe/functional/setup.csv
            .artifacts/postgresql-measurement/safe/functional/host-diagnostics.csv
            .artifacts/postgresql-measurement/safe/functional/composition-*.identity.json
            .artifacts/postgresql-measurement/safe/functional/composition-*.exceptions.jsonl
            .artifacts/postgresql-measurement/safe/functional/protected-reflection-diagnostics.csv
            .artifacts/postgresql-measurement/safe/infrastructure-qualification/cases.json
            .artifacts/postgresql-measurement/safe/infrastructure-qualification/counts.json
            .artifacts/postgresql-measurement/safe/infrastructure-qualification/failure-evidence.json
            .artifacts/postgresql-measurement/safe/infrastructure-qualification/resources.json
            .artifacts/postgresql-measurement/safe/infrastructure-qualification/setup.csv
          if-no-files-found: error
          retention-days: 14
