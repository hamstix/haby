name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # Required to run the current net7.0 testhost until the M1 migration.
          dotnet-version: 7.0.x

      - name: Restore
        run: dotnet restore ./HamstixHaby.slnx --artifacts-path ./.artifacts

      - name: Build
        run: dotnet build ./HamstixHaby.slnx --no-restore --artifacts-path ./.artifacts

      - name: Test
        run: dotnet test ./HamstixHaby.slnx --no-build --artifacts-path ./.artifacts

      - name: Verify formatting
        run: dotnet format ./HamstixHaby.slnx --verify-no-changes --severity warn

      - name: Verify generated diff
        run: git diff --check --exit-code
