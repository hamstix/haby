name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ./HamstixHaby.slnx --artifacts-path ./.artifacts

      - name: Build
        run: dotnet build ./HamstixHaby.slnx --no-restore --artifacts-path ./.artifacts

      - name: Test
        run: dotnet test ./HamstixHaby.slnx --no-build --artifacts-path ./.artifacts

      - name: Verify PostgreSQL timing artifact safety and failure propagation
        shell: pwsh
        run: ./scripts/test-postgresql-timing-export.ps1

      - name: Verify hosted entrypoint ownership, coverage and failure propagation
        shell: pwsh
        run: ./scripts/test-postgresql-entrypoint.ps1

      - name: Verify Native AOT prerequisite fallback and failure propagation
        run: bash ./scripts/test-native-aot-prerequisites.sh

      - name: Audit vulnerable dependencies
        run: |
          dotnet package list --project ./HamstixHaby.slnx --vulnerable --include-transitive --format json > dependency-audit.json
          jq -e '[.. | objects | select(has("severity"))] | length == 0' dependency-audit.json

      - name: Verify formatting
        run: dotnet format ./HamstixHaby.slnx --verify-no-changes --severity warn

      - name: Verify generated diff
        run: git diff --check --exit-code

  native-aot:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            executable: habyctl.exe
          - os: ubuntu-latest
            rid: linux-x64
            executable: habyctl
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Linux Native AOT prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/ensure-native-aot-prerequisites.sh
      - name: Publish Native AOT executable (warnings as errors)
        run: |
          $toolchain = @()
          if ($IsLinux) {
            if (-not $env:HABY_AOT_C_COMPILER) { throw 'Validated Native AOT compiler is missing.' }
            $toolchain = @("-p:CppCompilerAndLinker=$env:HABY_AOT_C_COMPILER", '-p:LinkerFlavor=bfd')
          }
          dotnet publish ./src/habyctl/habyctl.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:TreatWarningsAsErrors=true @toolchain -o ./.artifacts/aot/${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { throw "Native AOT publish failed: $LASTEXITCODE" }
      - name: Execute published help and version
        run: |
          $cli = (Resolve-Path ./.artifacts/aot/${{ matrix.rid }}/${{ matrix.executable }}).Path
          & $cli --help
          if ($LASTEXITCODE -ne 0) { throw "Native AOT help failed: $LASTEXITCODE" }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "Native AOT version failed: $LASTEXITCODE" }
      - name: Test published binary against disposable loopback hosts
        run: |
          $env:HABY_AOT_CLI_REQUIRED = '1'
          $env:HABY_AOT_CLI_PATH = (Resolve-Path ./.artifacts/aot/${{ matrix.rid }}/${{ matrix.executable }}).Path
          dotnet test ./tests/Haby.Cli.Tests/Haby.Cli.Tests.csproj -c Release --filter FullyQualifiedName~CliLoopbackTests -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw "Native AOT loopback tests failed: $LASTEXITCODE" }

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Review dependency licenses and vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  postgresql-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Native AOT prerequisites
        run: bash ./scripts/ensure-native-aot-prerequisites.sh
      - name: Publish native CLI for persisted planning, commit, execution and recovery rehearsals
        run: |
          test -n "$HABY_AOT_C_COMPILER"
          dotnet publish ./src/habyctl/habyctl.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -p:TreatWarningsAsErrors=true "-p:CppCompilerAndLinker=$HABY_AOT_C_COMPILER" -p:LinkerFlavor=bfd -o ./.artifacts/aot/linux-x64
      - name: Run real PostgreSQL integration tests
        shell: pwsh
        env:
          HABY_AOT_CLI_REQUIRED: '1'
          HABY_AOT_CLI_PATH: ${{ github.workspace }}/.artifacts/aot/linux-x64/habyctl
        run: ./scripts/test-postgresql-measured.ps1 -Docker -ResultsDirectory ./.artifacts/postgresql-measurement
      - name: Publish allowlisted PostgreSQL timing and case inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-timing-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/postgresql-measurement/safe/measurement.json
            .artifacts/postgresql-measurement/safe/preflight.json
            .artifacts/postgresql-measurement/safe/resources.json
            .artifacts/postgresql-measurement/safe/coverage.json
            .artifacts/postgresql-measurement/safe/cases.json
            .artifacts/postgresql-measurement/safe/counts.json
            .artifacts/postgresql-measurement/safe/top-duration.csv
            .artifacts/postgresql-measurement/safe/class-duration.csv
            .artifacts/postgresql-measurement/safe/setup.csv
            .artifacts/postgresql-measurement/safe/results.trx
            .artifacts/postgresql-measurement/safe/host-diagnostics.csv
          if-no-files-found: error
          retention-days: 14
