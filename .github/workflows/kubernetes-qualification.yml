name: Kubernetes qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Haby.Kubernetes/**'
      - 'tools/Haby.Kubernetes.Qualification/**'
      - 'scripts/*kubernetes-qualification*.ps1'
      - '.github/workflows/kubernetes-qualification.yml'
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore exact qualification dependencies
        run: dotnet restore tools/Haby.Kubernetes.Qualification --locked-mode
      - name: Audit qualification dependency closure
        run: |
          mkdir -p .artifacts
          dotnet package list --project tools/Haby.Kubernetes.Qualification --vulnerable --include-transitive --format json > .artifacts/qualification-audit.json
          jq -e '[.. | objects | select(has("severity"))] | length == 0' .artifacts/qualification-audit.json
      - name: Check failure propagation
        shell: pwsh
        run: ./scripts/test-kubernetes-qualification.ps1
      - name: Real API and failure teardown rehearsals
        shell: pwsh
        run: ./scripts/test-kubernetes-qualification-real.ps1 -Runtime docker
      - name: Verify Provider access cases in the existing real API rehearsal
        shell: pwsh
        run: |
          $evidence = @(Get-ChildItem .artifacts/qualification-evidence/haby179-control-*/qualification-success.txt)
          if ($evidence.Count -ne 1) { throw 'Provider access evidence is missing or ambiguous.' }
          $lines = @(Get-Content -LiteralPath $evidence[0].FullName)
          $ids = @($lines | Where-Object { $_ -cmatch '^PASS provider-P[0-9]{2}-[a-zA-Z0-9-]+$' } | ForEach-Object { $_.Substring(14,3) })
          if (($ids -join ',') -cne ((1..10 | ForEach-Object { 'P{0:d2}' -f $_ }) -join ',')) { throw 'Provider access cases are incomplete.' }
          $method = 'Haby.Kubernetes.Qualification.ProviderAccessCases.Run'
          $cases = @(foreach ($line in $lines) {
            if ($line -cmatch '^PASS provider-(P[0-9]{2}-[a-zA-Z0-9-]+)$') {
              $identity = $method + "`n" + $Matches[1]
              [pscustomobject]@{ method = $method; case = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identity))).ToLowerInvariant(); outcome = 'Passed' }
            }
          })
          . ./scripts/test-suite-plan.ps1
          Assert-HabyGatePlan $cases ./tests/Haby.PostgreSql.IntegrationTests/suite-gate-map.json 'kubernetes-provider-access' @('api-authentication')
          New-Item -ItemType Directory -Force .artifacts/provider-access | Out-Null
          $cases | ConvertTo-Json -Depth 4 | Set-Content .artifacts/provider-access/cases.json -Encoding utf8
          [pscustomobject]@{ source = (& git rev-parse HEAD); dirty = [bool](& git status --porcelain); sdk = (& dotnet --version); gate = 'kubernetes-provider-access'; suite = 'api-authentication'; cases = $cases.Count; status = 'complete' } |
            ConvertTo-Json | Set-Content .artifacts/provider-access/gate.json -Encoding utf8
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-qualification
          path: |
            .artifacts/qualification-evidence/haby179-control-*/qualification-success.txt
            .artifacts/qualification-evidence/haby179-control-*/qualification-stock.txt
            .artifacts/qualification-evidence/haby179-control-*/qualification-port-collision.txt
            .artifacts/qualification-evidence/haby179-control-*/qualification-readiness-failure.txt
            .artifacts/provider-access/cases.json
            .artifacts/provider-access/gate.json
          if-no-files-found: error
