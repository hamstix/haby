name: Kubernetes Deployment kernel
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Haby.Kubernetes/**'
      - 'src/Haby.Kubernetes.Contracts/**'
      - 'tests/Haby.Kubernetes.Tests/**'
      - 'tools/Haby.Kubernetes.Qualification/**'
      - 'scripts/*kubernetes-qualification*.ps1'
      - '.github/workflows/kubernetes-deployment-kernel.yml'
      - 'Directory.Packages.props'
permissions:
  contents: read
jobs:
  deployment-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore pinned adapter contour
        run: dotnet restore tools/Haby.Kubernetes.Qualification --locked-mode
      - name: Reuse qualified Docker launcher for adapter cases only
        shell: pwsh
        run: ./scripts/run-kubernetes-qualification.ps1 -Runtime docker -DeploymentKernel -EvidencePath .artifacts/deployment-kernel/evidence.txt
      - name: Verify complete adapter case inventory and owned cleanup
        shell: pwsh
        run: |
          $lines = @(Get-Content .artifacts/deployment-kernel/evidence.txt)
          $ids = @($lines | Where-Object { $_ -cmatch '^PASS kernel-K[0-9]{2}-[a-zA-Z0-9-]+$' } | ForEach-Object { $_.Substring(12,3) })
          $expected = @(1..24 | ForEach-Object { 'K{0:d2}' -f $_ })
          if (($ids -join ',') -cne ($expected -join ',') -or 'Harness: PASS' -notin $lines -or
              'PASS kernel-cleanup-ownership' -notin $lines -or 'PASS kernel-namespace-absence-after-UID-delete' -notin $lines -or
              'Run-owned private directory removed.' -notin $lines -or
              @($lines | Where-Object { $_ -match '^Run-owned container and [0-9]+ anonymous volumes absent\.$' }).Count -ne 1 -or
              @($lines | Where-Object { $_ -match '^FAIL |^Failure:|cleanup: FAIL|stop: FAIL|Evidence write: FAIL' }).Count) { throw 'Adapter evidence incomplete.' }
          $method = 'Haby.Kubernetes.Qualification.DeploymentKernelCases.Run'
          $cases = @(foreach ($line in $lines) {
            if ($line -cmatch '^PASS kernel-(K[0-9]{2}-[a-zA-Z0-9-]+)$') {
              $identity = $method + "`n" + $Matches[1]
              [pscustomobject]@{ method = $method; case = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identity))).ToLowerInvariant(); outcome = 'Passed' }
            }
          })
          . ./scripts/test-suite-plan.ps1
          Assert-HabyGatePlan $cases ./tests/Haby.PostgreSql.IntegrationTests/suite-gate-map.json 'kubernetes-deployment-kernel' @('api-object')
          $cases | ConvertTo-Json -Depth 4 | Set-Content .artifacts/deployment-kernel/cases.json -Encoding utf8
          [pscustomobject]@{ source = (& git rev-parse HEAD); dirty = [bool](& git status --porcelain); sdk = (& dotnet --version); gate = 'kubernetes-deployment-kernel'; suite = 'api-object'; cases = $cases.Count; status = 'complete' } |
            ConvertTo-Json | Set-Content .artifacts/deployment-kernel/gate.json -Encoding utf8
      - name: Upload bounded adapter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-deployment-kernel-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .artifacts/deployment-kernel/evidence.txt
            .artifacts/deployment-kernel/cases.json
            .artifacts/deployment-kernel/gate.json
          if-no-files-found: error
          retention-days: 14
