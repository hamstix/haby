name: Temporary issue 223 import only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-only:
    if: github.ref == 'refs/heads/codex/ci-223-import-only' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed temporary orchestration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: orchestration
          persist-credentials: false
      - name: Check out exact frozen product source
        uses: actions/checkout@v4
        with:
          ref: 47dcc8c3dc2e0fa720230a480b36340a834c4863
          path: product
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: product/global.json
      - name: Verify synthetic excerpt privacy controls
        shell: pwsh
        run: ./orchestration/scripts/test-issue-223-import-only.ps1
      - name: Run the single bounded import-only attempt
        working-directory: product
        shell: pwsh
        env:
          HABY_IMPORT_ORCHESTRATION_SHA: ${{ github.sha }}
        run: ../orchestration/scripts/issue-223-import-only.ps1 -ProductRoot . -EvidencePath ../.artifacts/import-only/evidence.json
      - name: Upload only sanitized import and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-223-import-only-${{ github.sha }}-${{ github.run_id }}
          path: .artifacts/import-only/evidence.json
          if-no-files-found: error
          retention-days: 7
