syntax = "proto3";
option csharp_namespace = "Haby.Operator.Contracts";
package haby.operator.v1alpha1;

// Internal alpha contract. No compatibility promise before M4.
service ManifestOperator {
  rpc Validate(EnvelopeRequest) returns (ValidateReply);
  rpc Import(EnvelopeRequest) returns (ImportReply);
  rpc GetRevision(GetRevisionRequest) returns (GetRevisionReply);
  rpc PreviewDatabase(PreviewDatabaseRequest) returns (PreviewDatabaseReply);
  rpc CreateChangeSet(CreateChangeSetRequest) returns (PlanningReply);
  rpc GetChangeSet(ChangeSetRequest) returns (PlanningReply);
  rpc CreatePlan(ChangeSetRequest) returns (PlanningReply);
  rpc GetPlan(PlanRequest) returns (PlanningReply);
  rpc CheckPlan(PlanRequest) returns (PlanningReply);
  rpc ClosePlan(PlanRequest) returns (PlanningReply);
  // Accepts desired state and Pending work only; never executes a Provider.
  rpc CommitDesiredState(CommitDesiredStateRequest) returns (CommitReply);
  rpc GetCommit(ChangeSetRequest) returns (CommitReply);
  rpc GetGeneration(GenerationRequest) returns (CommitReply);
  // Explicit execution only; GetOperation never dispatches or recovers.
  rpc ExecuteOperation(OperationRequest) returns (OperationReply);
  rpc GetOperation(OperationRequest) returns (OperationReply);
  rpc InspectOperationRecovery(OperationRequest) returns (RecoveryReply);
  rpc AssignExistingOperation(AssignExistingOperationRequest) returns (RecoveryReply);
}

message EnvelopeRequest { bytes original_envelope = 1; }
message SourceLocation { int32 line = 1; int32 column = 2; }
message Diagnostic {
  string code = 1;
  string path = 2;
  string message = 3;
  string severity = 4;
  map<string, string> parameters = 5;
  repeated string related_paths = 6;
  SourceLocation location = 7;
}
message DiagnosticReport { repeated Diagnostic diagnostics = 1; bool truncated = 2; }
message RevisionReference { string application_record_id = 1; int64 revision_number = 2; }
message RevisionSummary {
  RevisionReference reference = 1;
  string revision_id = 2;
  string application_id = 3;
  string application_version = 4;
  string input_api_version = 5;
  int32 normalized_model_version = 6;
  DiagnosticReport historical_warnings = 7;
  string technical_actor_id = 8;
  string imported_at_utc = 9;
}
message ValidManifest { string application_id = 1; string application_version = 2; DiagnosticReport warnings = 3; }
message InvalidManifest { DiagnosticReport report = 1; }
message InvalidRequest { DiagnosticReport report = 1; }
message ValidateReply {
  oneof outcome {
    ValidManifest valid = 1;
    InvalidRequest invalid_request = 2;
    InvalidManifest invalid_manifest = 3;
  }
}
message ImportAccepted { RevisionSummary revision = 1; }
message VersionContentConflict {
  string application_id = 1;
  string application_version = 2;
  RevisionReference existing_revision = 3;
  repeated string changed_paths = 4;
  bool changed_paths_truncated = 5;
}
message ImportReply {
  oneof outcome {
    ImportAccepted created = 1;
    ImportAccepted existing_equivalent = 2;
    InvalidRequest invalid_request = 3;
    InvalidManifest invalid_manifest = 4;
    VersionContentConflict version_content_conflict = 5;
  }
}
message GetRevisionRequest { RevisionReference reference = 1; }
message GetRevisionReply {
  oneof outcome {
    RevisionSummary found = 1;
    RevisionReference not_found = 2;
  }
}

// Request-scoped hypothetical metadata; no credentials or reusable Plan identity.
message PreviewProviderSelection {
  string alias = 1;
  string instance_id = 2;
  int64 configuration_revision = 3;
  string implementation_id = 4;
}
message PreviewDatabaseRequest {
  RevisionReference reference = 1;
  string environment_id = 2;
  repeated PreviewProviderSelection providers = 3;
}
message PreviewWouldCreate {
  string environment_id = 1;
  string resource_id = 2;
  string database_name = 3;
  string provider_alias = 4;
  string instance_id = 5;
  int64 configuration_revision = 6;
  string implementation_id = 7;
}
message PreviewAliasFailure { string alias = 1; }
message PreviewDatabaseReply {
  oneof outcome {
    PreviewWouldCreate would_create = 1;
    bool revision_not_found = 2;
    bool invalid_context = 3;
    PreviewAliasFailure alias_not_resolved = 4;
    PreviewAliasFailure capability_mismatch = 5;
    bool unsupported_shape = 6;
  }
}

// Durable planning only. No caller-supplied actor, Provider payload, or execution capability.
enum PlanningStatus {
  PLANNING_STATUS_UNSPECIFIED = 0;
  PLANNING_STATUS_CREATED = 1;
  PLANNING_STATUS_FOUND = 2;
  PLANNING_STATUS_PLANNED = 3;
  PLANNING_STATUS_CURRENT = 4;
  PLANNING_STATUS_CLOSED = 5;
  PLANNING_STATUS_ALREADY_CLOSED = 6;
  PLANNING_STATUS_INVALID_REQUEST = 7;
  PLANNING_STATUS_ENVIRONMENT_NOT_FOUND = 8;
  PLANNING_STATUS_REVISION_NOT_FOUND = 9;
  PLANNING_STATUS_REVISION_NOT_OWNED_BY_APPLICATION = 10;
  PLANNING_STATUS_UNSUPPORTED_PRECONDITION = 11;
  PLANNING_STATUS_CHANGE_SET_NOT_FOUND = 12;
  PLANNING_STATUS_CHANGE_SET_STALE = 13;
  PLANNING_STATUS_ALIAS_NOT_RESOLVED = 14;
  PLANNING_STATUS_PROVIDER_REVISION_UNAVAILABLE = 15;
  PLANNING_STATUS_PROVIDER_CAPABILITY_MISMATCH = 16;
  PLANNING_STATUS_UNSUPPORTED_SHAPE = 17;
  PLANNING_STATUS_PLAN_NOT_FOUND = 18;
  PLANNING_STATUS_EXPIRED = 19;
  PLANNING_STATUS_PLAN_STALE = 20;
  PLANNING_STATUS_PLAN_INPUT_UNAVAILABLE = 21;
}
enum PlanningPrecondition {
  PLANNING_PRECONDITION_UNSPECIFIED = 0;
  PLANNING_PRECONDITION_EXPECTED_ABSENCE = 1;
  PLANNING_PRECONDITION_EXPECTED_GENERATION = 2;
}
message CreateChangeSetRequest {
  // Logical lowercase kebab-case EnvironmentId, unique in this registry, never a UUID.
  string environment_id = 1;
  RevisionReference reference = 2;
  PlanningPrecondition precondition = 3;
}
message ChangeSetRequest { string change_set_id = 1; }
message PlanRequest { string plan_id = 1; }
message DurableChangeSetSummary {
  string change_set_id = 1;
  string environment_record_id = 2;
  RevisionReference reference = 3;
  PlanningPrecondition precondition = 4;
  string created_at_utc = 5;
  string technical_actor_id = 6;
}
message DurablePlanSummary {
  string plan_id = 1;
  string change_set_id = 2;
  string environment_record_id = 3;
  string environment_id = 4;
  RevisionReference reference = 5;
  string provider_alias = 6;
  string provider_instance_id = 7;
  int64 configuration_revision = 8;
  string implementation_id = 9;
  string fingerprint = 10;
  string created_at_utc = 11;
  string expires_at_utc = 12;
  string technical_actor_id = 13;
  optional string closed_at_utc = 14;
  optional string closed_by_technical_actor_id = 15;
  PlanDescription intended_work = 16;
}
// Immutable intended work only: no Provider preflight, absence check or execution guarantee.
enum PlanDescriptionStatus {
  PLAN_DESCRIPTION_STATUS_UNSPECIFIED = 0;
  PLAN_DESCRIPTION_STATUS_AVAILABLE = 1;
  PLAN_DESCRIPTION_STATUS_REVISION_NOT_FOUND = 2;
  PLAN_DESCRIPTION_STATUS_INPUT_CORRUPT = 3;
  PLAN_DESCRIPTION_STATUS_UNSUPPORTED_SHAPE = 4;
  PLAN_DESCRIPTION_STATUS_PINNED_INPUT_MISMATCH = 5;
  PLAN_DESCRIPTION_STATUS_ACTION_DESCRIBER_UNAVAILABLE = 6;
}
enum IntendedActionKind {
  INTENDED_ACTION_KIND_UNSPECIFIED = 0;
  INTENDED_ACTION_KIND_CREATE = 1;
}
// A bounded, server-validated external object name for operator review.
// Its Resource contract defines its meaning; it is never a Provider address or payload.
message IntendedActionTarget { string name = 1; }
message IntendedPlanAction {
  IntendedActionKind kind = 1;
  string resource_id = 2;
  string resource_type = 3;
  IntendedActionTarget target = 4;
}
message PlanDescription {
  PlanDescriptionStatus status = 1;
  IntendedPlanAction action = 2;
}
message PlanningReply {
  PlanningStatus status = 1;
  DurableChangeSetSummary change_set = 2;
  DurablePlanSummary plan = 3;
}

// No caller-supplied actor or implicit Plan selection.
message CommitDesiredStateRequest { string change_set_id = 1; string plan_id = 2; }
message GenerationRequest { string deployment_id = 1; int64 generation = 2; }
enum CommitStatus {
  COMMIT_STATUS_UNSPECIFIED = 0;
  COMMIT_STATUS_COMMITTED = 1;
  COMMIT_STATUS_FOUND = 2;
  COMMIT_STATUS_INVALID_REQUEST = 3;
  COMMIT_STATUS_CHANGE_SET_NOT_FOUND = 4;
  COMMIT_STATUS_PLAN_NOT_FOUND = 5;
  COMMIT_STATUS_PLAN_DOES_NOT_BELONG_TO_CHANGE_SET = 6;
  COMMIT_STATUS_CLOSED = 7;
  COMMIT_STATUS_EXPIRED = 8;
  COMMIT_STATUS_CHANGE_SET_STALE = 9;
  COMMIT_STATUS_PLAN_STALE = 10;
  COMMIT_STATUS_PLAN_INPUT_UNAVAILABLE = 11;
  COMMIT_STATUS_UNSUPPORTED_PRECONDITION = 12;
  COMMIT_STATUS_UNSUPPORTED_SHAPE = 13;
  COMMIT_STATUS_COMMIT_NOT_FOUND = 14;
  COMMIT_STATUS_GENERATION_NOT_FOUND = 15;
}
message DurableCommitSummary {
  string change_set_id = 1;
  string plan_id = 2;
  string deployment_id = 3;
  int64 generation = 4;
  string committed_at_utc = 5;
  string technical_actor_id = 6;
}
// Immutable desired snapshot, never a claim about current applied/operation state.
message DesiredGenerationSummary {
  string deployment_id = 1;
  int64 generation = 2;
  string desired_presence = 3;
  string change_set_id = 4;
  string plan_id = 5;
  string accepted_at_utc = 6;
  string technical_actor_id = 7;
  string environment_record_id = 8;
  string environment_id = 9;
  RevisionReference reference = 10;
  string provider_alias = 11;
  string provider_instance_id = 12;
  int64 configuration_revision = 13;
  string implementation_id = 14;
}
message CommitReply {
  CommitStatus status = 1;
  DurableCommitSummary commit = 2;
  DesiredGenerationSummary desired_generation = 3;
  optional int64 actual_generation = 4;
}

// Exact provider-neutral identity. No credentials, overrides, actor, or implicit latest generation.
message OperationRequest {
  string deployment_id = 1;
  int64 generation = 2;
  string resource_id = 3;
  OperationAction action = 4;
}

// Recovery selects no Provider. The server uses the operation's immutable contract and implementation.
enum RecoveryReason {
  RECOVERY_REASON_UNSPECIFIED = 0;
  RECOVERY_REASON_OPERATOR_ACCEPTED_EXISTING_DATABASE = 1;
}
enum RecoveryStatus {
  RECOVERY_STATUS_UNSPECIFIED = 0;
  RECOVERY_STATUS_FOUND = 1;
  RECOVERY_STATUS_ASSIGNED = 2;
  RECOVERY_STATUS_ALREADY_ASSIGNED = 3;
  RECOVERY_STATUS_REJECTED = 4;
  RECOVERY_STATUS_TARGET_ABSENT = 5;
  RECOVERY_STATUS_TARGET_UNAVAILABLE = 6;
  RECOVERY_STATUS_OPERATION_NOT_FOUND = 7;
  RECOVERY_STATUS_INVALID_REQUEST = 8;
  RECOVERY_STATUS_UNSUPPORTED_RECOVERY_ACTION = 9;
}
message AssignExistingOperationRequest {
  OperationRequest key = 1;
  string environment_record_id = 2;
  string expected_attempt_id = 3;
  bool acknowledged = 4;
  RecoveryReason reason = 5;
  // Protected audit input. Never returned by ordinary operator reads or diagnostics.
  string note = 6;
}
message RecoveryReceipt {
  string decision_id = 1;
  OperationRequest key = 2;
  string attempt_id = 3;
  RecoveryReason reason = 4;
  string technical_actor = 5;
  string decided_at_utc = 6;
}
message RecoveryPreview {
  DurableOperationSummary operation = 1;
  string target_contract = 2;
  optional string target_name = 3;
  optional string uncertain_attempt_id = 4;
}
message RecoveryReply {
  RecoveryStatus status = 1;
  RecoveryPreview preview = 2;
  RecoveryReceipt receipt = 3;
}
enum OperationAction {
  OPERATION_ACTION_UNSPECIFIED = 0;
  OPERATION_ACTION_CREATE = 1;
}
enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_STATUS_FOUND = 1;
  OPERATION_STATUS_SUCCEEDED = 2;
  OPERATION_STATUS_FAILED = 3;
  OPERATION_STATUS_RETRYABLE_FAILURE = 4;
  OPERATION_STATUS_NEEDS_ATTENTION = 5;
  OPERATION_STATUS_OPERATION_NOT_FOUND = 6;
  OPERATION_STATUS_DISPATCH_UNCERTAIN = 7;
  OPERATION_STATUS_INVALID_REQUEST = 8;
  OPERATION_STATUS_UNSUPPORTED_ACTION = 9;
  OPERATION_STATUS_UNSUPPORTED_SHAPE = 10;
}
enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_PENDING = 1;
  OPERATION_STATE_PREPARING = 2;
  OPERATION_STATE_DISPATCHING = 3;
  OPERATION_STATE_SUCCEEDED = 4;
  OPERATION_STATE_FAILED = 5;
  OPERATION_STATE_NEEDS_ATTENTION = 6;
}
enum OperationReason {
  OPERATION_REASON_UNSPECIFIED = 0;
  OPERATION_REASON_PROVIDER_INPUT_UNAVAILABLE = 1;
  OPERATION_REASON_SECRET_UNAVAILABLE = 2;
  OPERATION_REASON_UNSUPPORTED_SHAPE = 3;
  OPERATION_REASON_DATABASE_NAME_INVALID = 4;
  OPERATION_REASON_CONNECTIVITY = 5;
  OPERATION_REASON_CONFLICT = 6;
  OPERATION_REASON_SERVER_REJECTED = 7;
  OPERATION_REASON_UNCERTAIN_AFTER_DISPATCH = 8;
}
enum OperationAttemptOutcome {
  OPERATION_ATTEMPT_OUTCOME_UNSPECIFIED = 0;
  OPERATION_ATTEMPT_OUTCOME_SUCCEEDED = 1;
  OPERATION_ATTEMPT_OUTCOME_CONFLICT = 2;
  OPERATION_ATTEMPT_OUTCOME_SERVER_REJECTED = 3;
  OPERATION_ATTEMPT_OUTCOME_UNCERTAIN = 4;
  OPERATION_ATTEMPT_OUTCOME_CANCELED_BEFORE_DISPATCH = 5;
  OPERATION_ATTEMPT_OUTCOME_ABANDONED_BEFORE_DISPATCH = 6;
  OPERATION_ATTEMPT_OUTCOME_FAILED_BEFORE_DISPATCH = 7;
}
message DurableOperationSummary {
  OperationRequest key = 1;
  OperationState state = 2;
  OperationReason reason = 3;
  string environment_record_id = 4;
  string application_record_id = 5;
  RevisionReference reference = 6;
  string provider_instance_id = 7;
  int64 configuration_revision = 8;
  string implementation_id = 9;
  string created_at_utc = 10;
  optional string updated_at_utc = 11;
  optional string attempt_id = 12;
  int64 attempt_number = 13;
  optional string dispatched_at_utc = 14;
  optional string finalized_at_utc = 15;
}
message OperationAttempt {
  string attempt_id = 1;
  int64 attempt_number = 2;
  string started_at_utc = 3;
  optional string dispatched_at_utc = 4;
  optional string finished_at_utc = 5;
  OperationAttemptOutcome outcome = 6;
}
message OperationReply {
  OperationStatus status = 1;
  DurableOperationSummary operation = 2;
  // Read-only history populated by GetOperation; ExecuteOperation returns its execution snapshot.
  repeated OperationAttempt attempts = 3;
}
