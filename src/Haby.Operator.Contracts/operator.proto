syntax = "proto3";
option csharp_namespace = "Haby.Operator.Contracts";
package haby.operator.v1alpha1;

// Internal alpha contract. No compatibility promise before M4.
service ManifestOperator {
  rpc Validate(EnvelopeRequest) returns (ValidateReply);
  rpc Import(EnvelopeRequest) returns (ImportReply);
  rpc GetRevision(GetRevisionRequest) returns (GetRevisionReply);
  rpc PreviewDatabase(PreviewDatabaseRequest) returns (PreviewDatabaseReply);
  rpc CreateChangeSet(CreateChangeSetRequest) returns (PlanningReply);
  rpc GetChangeSet(ChangeSetRequest) returns (PlanningReply);
  rpc CreatePlan(ChangeSetRequest) returns (PlanningReply);
  rpc GetPlan(PlanRequest) returns (PlanningReply);
  rpc CheckPlan(PlanRequest) returns (PlanningReply);
  rpc ClosePlan(PlanRequest) returns (PlanningReply);
}

message EnvelopeRequest { bytes original_envelope = 1; }
message SourceLocation { int32 line = 1; int32 column = 2; }
message Diagnostic {
  string code = 1;
  string path = 2;
  string message = 3;
  string severity = 4;
  map<string, string> parameters = 5;
  repeated string related_paths = 6;
  SourceLocation location = 7;
}
message DiagnosticReport { repeated Diagnostic diagnostics = 1; bool truncated = 2; }
message RevisionReference { string application_record_id = 1; int64 revision_number = 2; }
message RevisionSummary {
  RevisionReference reference = 1;
  string revision_id = 2;
  string application_id = 3;
  string application_version = 4;
  string input_api_version = 5;
  int32 normalized_model_version = 6;
  DiagnosticReport historical_warnings = 7;
  string technical_actor_id = 8;
  string imported_at_utc = 9;
}
message ValidManifest { string application_id = 1; string application_version = 2; DiagnosticReport warnings = 3; }
message InvalidManifest { DiagnosticReport report = 1; }
message InvalidRequest { DiagnosticReport report = 1; }
message ValidateReply {
  oneof outcome {
    ValidManifest valid = 1;
    InvalidRequest invalid_request = 2;
    InvalidManifest invalid_manifest = 3;
  }
}
message ImportAccepted { RevisionSummary revision = 1; }
message VersionContentConflict {
  string application_id = 1;
  string application_version = 2;
  RevisionReference existing_revision = 3;
  repeated string changed_paths = 4;
  bool changed_paths_truncated = 5;
}
message ImportReply {
  oneof outcome {
    ImportAccepted created = 1;
    ImportAccepted existing_equivalent = 2;
    InvalidRequest invalid_request = 3;
    InvalidManifest invalid_manifest = 4;
    VersionContentConflict version_content_conflict = 5;
  }
}
message GetRevisionRequest { RevisionReference reference = 1; }
message GetRevisionReply {
  oneof outcome {
    RevisionSummary found = 1;
    RevisionReference not_found = 2;
  }
}

// Request-scoped hypothetical metadata; no credentials or reusable Plan identity.
message PreviewProviderSelection {
  string alias = 1;
  string instance_id = 2;
  int64 configuration_revision = 3;
  string implementation_id = 4;
}
message PreviewDatabaseRequest {
  RevisionReference reference = 1;
  string environment_id = 2;
  repeated PreviewProviderSelection providers = 3;
}
message PreviewWouldCreate {
  string environment_id = 1;
  string resource_id = 2;
  string database_name = 3;
  string provider_alias = 4;
  string instance_id = 5;
  int64 configuration_revision = 6;
  string implementation_id = 7;
}
message PreviewAliasFailure { string alias = 1; }
message PreviewDatabaseReply {
  oneof outcome {
    PreviewWouldCreate would_create = 1;
    bool revision_not_found = 2;
    bool invalid_context = 3;
    PreviewAliasFailure alias_not_resolved = 4;
    PreviewAliasFailure capability_mismatch = 5;
    bool unsupported_shape = 6;
  }
}

// Durable planning only. No caller-supplied actor, Provider payload, or execution capability.
enum PlanningStatus {
  PLANNING_STATUS_UNSPECIFIED = 0;
  PLANNING_STATUS_CREATED = 1;
  PLANNING_STATUS_FOUND = 2;
  PLANNING_STATUS_PLANNED = 3;
  PLANNING_STATUS_CURRENT = 4;
  PLANNING_STATUS_CLOSED = 5;
  PLANNING_STATUS_ALREADY_CLOSED = 6;
  PLANNING_STATUS_INVALID_REQUEST = 7;
  PLANNING_STATUS_ENVIRONMENT_NOT_FOUND = 8;
  PLANNING_STATUS_REVISION_NOT_FOUND = 9;
  PLANNING_STATUS_REVISION_NOT_OWNED_BY_APPLICATION = 10;
  PLANNING_STATUS_UNSUPPORTED_PRECONDITION = 11;
  PLANNING_STATUS_CHANGE_SET_NOT_FOUND = 12;
  PLANNING_STATUS_CHANGE_SET_STALE = 13;
  PLANNING_STATUS_ALIAS_NOT_RESOLVED = 14;
  PLANNING_STATUS_PROVIDER_REVISION_UNAVAILABLE = 15;
  PLANNING_STATUS_PROVIDER_CAPABILITY_MISMATCH = 16;
  PLANNING_STATUS_UNSUPPORTED_SHAPE = 17;
  PLANNING_STATUS_PLAN_NOT_FOUND = 18;
  PLANNING_STATUS_EXPIRED = 19;
  PLANNING_STATUS_PLAN_STALE = 20;
  PLANNING_STATUS_PLAN_INPUT_UNAVAILABLE = 21;
}
enum PlanningPrecondition {
  PLANNING_PRECONDITION_UNSPECIFIED = 0;
  PLANNING_PRECONDITION_EXPECTED_ABSENCE = 1;
  PLANNING_PRECONDITION_EXPECTED_GENERATION = 2;
}
message CreateChangeSetRequest {
  // Logical lowercase kebab-case EnvironmentId, unique in this registry, never a UUID.
  string environment_id = 1;
  RevisionReference reference = 2;
  PlanningPrecondition precondition = 3;
}
message ChangeSetRequest { string change_set_id = 1; }
message PlanRequest { string plan_id = 1; }
message DurableChangeSetSummary {
  string change_set_id = 1;
  string environment_record_id = 2;
  RevisionReference reference = 3;
  PlanningPrecondition precondition = 4;
  string created_at_utc = 5;
  string technical_actor_id = 6;
}
message DurablePlanSummary {
  string plan_id = 1;
  string change_set_id = 2;
  string environment_record_id = 3;
  string environment_id = 4;
  RevisionReference reference = 5;
  string provider_alias = 6;
  string provider_instance_id = 7;
  int64 configuration_revision = 8;
  string implementation_id = 9;
  string fingerprint = 10;
  string created_at_utc = 11;
  string expires_at_utc = 12;
  string technical_actor_id = 13;
  optional string closed_at_utc = 14;
  optional string closed_by_technical_actor_id = 15;
}
message PlanningReply {
  PlanningStatus status = 1;
  DurableChangeSetSummary change_set = 2;
  DurablePlanSummary plan = 3;
}
